name: orion-exextra
services:
  api:
    build:
      context: ./api
      args:
        HTTP_PROXY: ${BUILD_HTTP_PROXY:-}
        HTTPS_PROXY: ${BUILD_HTTPS_PROXY:-}
    ports:
      - "127.0.0.1:3004:3000"
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${DB_USER:?Prepare o .env}
      DB_PASS: ${DB_PASS:?Prepare o .env}
      DB_NAME: ${DB_NAME:?Prepare o .env}
    depends_on:
      db:
        condition: service_healthy
    networks: [app]
    volumes:
      - ./api/app:/app/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "3000", "--reload", "--reload-dir", "/app/app"]
  db:
    image: postgres:17.2-bookworm
    environment:
      POSTGRES_USER: ${DB_USER:?Prepare o .env}
      POSTGRES_PASSWORD: ${DB_PASS:?Prepare o .env}
      POSTGRES_DB: ${DB_NAME:?Prepare o .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [app]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
  pgadmin:
    image: dpage/pgadmin4:8.14
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:?Prepare o .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?Prepare o .env}
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks: [app]
    depends_on:
      db:
        condition: service_healthy
networks:
  app: {}
volumes:
  postgres_data: {}
  pgadmin_data: {}
